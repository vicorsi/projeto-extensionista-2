spring:
  application:
    name: ebd-gestao
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

app:
  jwt:
    # Em produção, defina JWT_SECRET com no mínimo 32 caracteres aleatórios.
    secret: ${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789abcdef}
    expiration-hours: ${JWT_EXPIRATION_HOURS:12}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/ebd-gestao;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password: ""

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ebd_gestao}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
