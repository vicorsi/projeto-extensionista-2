services:
  postgres:
    image: postgres:16-alpine
    container_name: ebd-gestao-db
    environment:
      POSTGRES_DB: ebd_gestao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ebd_pgdata:/var/lib/postgresql/data

volumes:
  ebd_pgdata:
